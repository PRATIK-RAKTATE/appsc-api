name: Node.js API – CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.js"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.js"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Stub values used only by unit/integration tests.
          # Real secrets are never stored here.
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST || 'mongodb://localhost:27017/appsc_test' }}
          JWT_ACCESS_SECRET: ci-test-access-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real
          # R2 – tests mock the SDK; these stubs prevent startup warnings.
          R2_ENDPOINT: https://stub.r2.cloudflarestorage.com
          R2_BUCKET_NAME: stub-bucket
          R2_ACCESS_KEY_ID: stub-access-key-id
          R2_SECRET_ACCESS_KEY: stub-secret-access-key
